server:
  port: 8888

spring:
  application:
    name: gateway
  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        register: true
        health-check-path: /actuator/health
        health-check-interval: 10s
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: client-service
          uri: lb://service-client
          predicates:
            - Path=/api/clients/**
        - id: voiture-service
          uri: lb://service-voiture
          predicates:
            - Path=/api/voitures/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
